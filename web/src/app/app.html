<header class="app-header">
  <h1>Sales Districts</h1>
</header>

<main class="app-main">
  <aside class="pane list-pane">
    <app-district-list
      [districts]="districts()"
      [loading]="loading()"
      [selectedId]="selectedId()"
      (select)="onSelect($event)"
    />
  </aside>

  <section class="pane detail-pane">
    <app-district-detail [detail]="detail()" [loading]="detailLoading()" />
  </section>
</main>
